name: Build Libsodium for Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget tar

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Download and Build Libsodium
        run: |
          # Unduh TARBALL rilis resmi (sudah berisi ./configure, jadi tak perlu autotools/autogen)
          wget -q "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz" -O libsodium-1.0.20.tar.gz
          tar -xf libsodium-1.0.20.tar.gz
          cd libsodium-1.0.20

          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Menggunakan NDK dari: $ANDROID_NDK_HOME"
          
          export NDK_PLATFORM="android-24"
          export CFLAGS="-O2 -fPIC"
          export LIBSODIUM_FULL_BUILD=1   # pastikan crypto_sign (Ed25519) + crypto_hash_sha256 ikut ter-build
          chmod +x dist-build/*.sh

          ./dist-build/android-armv8-a.sh
          ./dist-build/android-armv7-a.sh

          mkdir -p ../libsodium-binaries/arm64-v8a/lib
          mkdir -p ../libsodium-binaries/armeabi-v7a/lib
          mkdir -p ../libsodium-binaries/include/sodium

          # Nama folder = libsodium-android-${TARGET_ARCH}. armv8 = 'armv8-a+crypto' (ada suffix!),
          # armv7 = 'armv7-a'. Pakai glob agar tahan perubahan nama.
          ls -d libsodium-android-*

          cp libsodium-android-armv8-a*/lib/libsodium.a ../libsodium-binaries/arm64-v8a/lib/
          cp libsodium-android-armv7-a*/lib/libsodium.a ../libsodium-binaries/armeabi-v7a/lib/
          cp libsodium-android-armv8-a*/include/sodium.h ../libsodium-binaries/include/
          cp -r libsodium-android-armv8-a*/include/sodium/* ../libsodium-binaries/include/sodium/

      - name: Upload Libsodium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsodium-android-static-libs
          path: libsodium-binaries/
